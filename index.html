<!doctype html>

<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>蘋果 • 綠植 • 悠閒 — 個人網頁</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root{
      --sand: #DDC57A; /* DDC57A */
      --terra: #CE7E5A; /* CE7E5A */
      --cream: #F9E7B2; /* F9E7B2 */
      --rose: #D34E4E; /* D34E4E */--bg: linear-gradient(180deg, rgba(249,231,178,1) 0%, rgba(221,197,122,0.95) 50%, rgba(206,126,90,0.03) 100%);
  --glass: rgba(255,255,255,0.6);
  --muted: rgba(0,0,0,0.55);
}

*{box-sizing:border-box}
html,body{height:100%;margin:0;font-family:Inter,system-ui,Arial; background:var(--bg); color:#1b1b1b; -webkit-font-smoothing:antialiased}

.page{
  min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:48px 24px;
  gap:36px;
}

.container{width:100%;max-width:1100px}

header{
  display:flex;align-items:center;justify-content:space-between;gap:16px; margin-bottom:6px
}

.brand{display:flex;gap:14px;align-items:center}
.logo{
  width:64px;height:64px;border-radius:18px;background:linear-gradient(135deg,var(--sand),var(--terra));
  display:grid;place-items:center;box-shadow:0 8px 30px rgba(19,34,19,0.08);
}

/* simple apple + leaf icon with SVG inside */
.logo svg{width:42px;height:42px}

h1{font-family:'Playfair Display',serif;margin:0;font-size:24px;letter-spacing:0.4px}
p.lead{margin:0;color:var(--muted);font-size:14px}

nav{display:flex;gap:12px}
.btn{padding:10px 14px;border-radius:12px;background:var(--glass);backdrop-filter: blur(6px);border:1px solid rgba(0,0,0,0.05);font-weight:600;cursor:pointer}
.btn.cta{background:linear-gradient(90deg,var(--rose),var(--terra));color:white;border:none;box-shadow:0 8px 22px rgba(211,78,78,0.18)}

/* hero */
.hero{display:grid;grid-template-columns:1fr 420px;gap:28px;align-items:center;margin-top:6px}
.card{
  padding:28px;border-radius:20px;background:linear-gradient(180deg, rgba(255,255,255,0.7), rgba(255,255,255,0.55)); box-shadow:0 12px 40px rgba(13,20,11,0.06);
}

.intro h2{margin:0 0 8px 0;font-size:28px}
.intro p{margin:0;color:rgba(0,0,0,0.6);line-height:1.6}

.apple-illustration{display:grid;place-items:center}
.apple-frame{width:380px;height:320px;border-radius:18px;background:linear-gradient(135deg, rgba(249,231,178,0.9), rgba(206,126,90,0.06));display:flex;align-items:center;justify-content:center;position:relative;overflow:visible}
.apple-frame svg{width:220px;height:220px}

/* plants gallery */
.plants{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:18px}
.plant-card{padding:14px;border-radius:14px;background:linear-gradient(180deg, rgba(255,255,255,0.8), rgba(255,255,255,0.6));display:flex;gap:12px;align-items:center}
.plant-thumb{width:72px;height:72px;border-radius:12px;flex-shrink:0;display:grid;place-items:center}
.plant-thumb svg{width:48px;height:48px}
.plant-info h4{margin:0;font-size:15px}
.plant-info p{margin:4px 0 0 0;font-size:13px;color:var(--muted)}

footer{width:100%;margin-top:24px;padding:18px;border-radius:12px;background:transparent;display:flex;justify-content:space-between;align-items:center;color:rgba(0,0,0,0.6)}

/* responsive */
@media (max-width:980px){
  .hero{grid-template-columns:1fr;}
  .apple-frame{width:100%;height:260px}
  .plants{grid-template-columns:repeat(2,1fr)}
}
@media (max-width:520px){
  .plants{grid-template-columns:1fr}
  header{flex-direction:column;align-items:flex-start}
  nav{width:100%;display:flex;justify-content:space-between}
}

/* small decorative floating leaves */
.leaf{position:absolute;opacity:0.9;filter:drop-shadow(0 8px 20px rgba(13,20,11,0.06));transform-origin:center}
.leaf.l1{left:-8%;top:8%;width:90px;transform:rotate(-12deg)}
.leaf.l2{right:-6%;bottom:6%;width:120px;transform:rotate(18deg)}

  </style>
</head>
<body>
  <div class="page">
    <div class="container">
      <header>
        <div class="brand">
          <div class="logo" aria-hidden="true">
            <!-- Apple + leaf SVG -->
            <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
              <g fill="none" fill-rule="evenodd">
                <path d="M38.8 12.3c2.8-3.5 2.6-7.9 2.5-8.6-2.5.1-5.5 1.7-7.2 3.9-1.6 2.1-3 5.5-2.6 8.6 2.6.2 5.4-1.3 7.3-3.9z" fill="#6AA84F"/>
                <path d="M45.2 28.9c-.6-7.3 6-10.8 6.3-10.9-3.4-5-8.7-5.7-10.6-5.8-4.5-.5-8.8 2.7-11.1 2.7-2.3 0-5.9-2.6-9.7-2.5-5 .1-9.6 3-12.2 7.6-5.2 8.9-1.3 22.2 3.7 29.5 2.5 3.6 5.5 7.6 9.4 7.5 3.7-.1 5.1-2.4 9.6-2.4 4.4 0 5.7 2.4 9.7 2.3 4.3-.1 7.1-3.6 9.5-7.2 3.1-4.7 4.4-9.3 4.5-9.5-.1-.1-8.3-3.1-8.9-12.1z" fill="#D34E4E"/>
              </g>
            </svg>
          </div>
          <div>
            <h1>柏羚的悠閒角落</h1>
            <p class="lead">蘋果、綠意與慢生活的混搭風格個人網頁</p>
          </div>
        </div><nav>
      <button class="btn">關於</button>
      <button class="btn">作品</button>
      <button class="btn cta">聯絡我</button>
    </nav>
  </header>

  <section class="hero">
    <div class="card intro">
      <h2>嗨，我是柏羚</h2>
      <p>喜歡陽光、蘋果派的香氣與窗邊的綠植。這裡記錄我的小創作、靜謐的日常與一些設計靈感。風格以柔和的天然色系為主，帶點現代蘋果風的乾淨感，輔以植物手繪元素，呈現悠閒與自由的氛圍。</p>

      <div style="margin-top:18px;display:flex;gap:12px;align-items:center">
        <button class="btn">查看作品</button>
        <button class="btn cta">預約聊天</button>
      </div>

      <div class="plants" style="margin-top:20px">
        <div class="plant-card">
          <div class="plant-thumb" style="background:linear-gradient(180deg,var(--sand),rgba(206,126,90,0.06))">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M12 2c1-.5 3 0 3 0s0 2 1 3 1 2 0 3-3 2-4 3-2 3-2 4-2 2-3 1 0-3 0-4 2-3 3-4 1-3 1-5c0-1 1-1 1-1z" fill="#6AA84F"/></svg>
          </div>
          <div class="plant-info"><h4>窗邊小綠</h4><p>喜歡陽光與偶爾的澆水</p></div>
        </div>

        <div class="plant-card">
          <div class="plant-thumb" style="background:linear-gradient(180deg,var(--cream),rgba(206,126,90,0.04))">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M12 2c2 2 1 4 1 4s-1 2 1 3 3 1 3 4-2 5-3 6-4 1-5 0-2-4-2-6-1-4 0-6 3-3 4-5z" fill="#4C9A2A"/></svg>
          </div>
          <div class="plant-info"><h4>蘋果樹苗</h4><p>期待有天結實</p></div>
        </div>

        <div class="plant-card">
          <div class="plant-thumb" style="background:linear-gradient(180deg,var(--terra),rgba(221,197,122,0.06))">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M12 3c3 1 4 3 4 4s1 2 0 3-3 1-4 3-3 2-3 4-2 2-3 1 0-3 0-4 2-3 3-3 1-3 2-6c1-2 1-2 1-2z" fill="#5DAA3A"/></svg>
          </div>
          <div class="plant-info"><h4>多肉日記</h4><p>偶爾忘記澆水也沒關係</p></div>
        </div>

      </div>

    </div>

    <aside class="card apple-illustration">
      <div class="apple-frame">
        <!-- decorative leaves -->
        <svg class="leaf l1" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><path d="M18 50c10-22 36-30 51-23-8 11-18 20-28 27-12 8-23 9-23-4z" fill="#7BB26A"/></svg>

        <!-- main apple hero (stylized) -->
        <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="g1" x1="0" x2="1" y1="0" y2="1">
              <stop offset="0" stop-color="#FCE6B0" />
              <stop offset="1" stop-color="#D34E4E" />
            </linearGradient>
          </defs>
          <g transform="translate(20,10)">
            <ellipse cx="90" cy="110" rx="62" ry="72" fill="url(#g1)" />
            <path d="M70 60c18-22 48-18 48-18s-6 22-22 34c-16 12-36 5-44-6-3-5 2-12 18-10z" fill="#7BB26A"/>
            <rect x="86" y="12" width="10" height="30" rx="5" fill="#6A8C3A" transform="rotate(-15 90 27)"/>
          </g>
        </svg>

        <svg class="leaf l2" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><path d="M82 52c-12 14-36 20-48 15 9-12 20-22 30-29 12-9 25-7 18 14z" fill="#6FAE53"/></svg>

      </div>
    </aside>
  </section>

  <footer>
    <div>© <strong>柏羚</strong> • 慢生活設計</div>
    <div style="display:flex;gap:12px;align-items:center">
      <small style="color:var(--muted)">Email</small>
      <button class="btn">hello@yourmail.com</button>
    </div>
  </footer>

</div>

  </div>  <script>
    // small interaction: smooth scroll on nav buttons
    document.querySelectorAll('nav .btn, .btn').forEach(b => {
      b.addEventListener('click', e => {
        e.target.blur();
        // visual feedback
        b.style.transform = 'translateY(1px)';
        setTimeout(()=> b.style.transform = '', 120);
      });
    });
  </script></body>
</html>
